<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Complete your payment to access premium live bird nest webcam streaming on Nature on Zoom.">
  
  <title>Complete Payment — Nature on Zoom</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/svg/favicon.svg">
  
  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <!-- Header -->
    <header class="header">
      <div class="container header-inner">
        <!-- Logo -->
        <a href="index.html" class="logo" aria-label="Nature on Zoom Home">
          <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" fill="#7CB690" opacity="0.2"/>
            <circle cx="20" cy="20" r="14" fill="#7CB690" opacity="0.4"/>
            <path d="M20 10C20 10 14 16 14 22C14 25.3137 16.6863 28 20 28C23.3137 28 26 25.3137 26 22C26 16 20 10 20 10Z" fill="#5A9A6E"/>
            <circle cx="18" cy="20" r="2" fill="white"/>
            <circle cx="22" cy="20" r="2" fill="white"/>
            <path d="M18 24C18 24 19 25 20 25C21 25 22 24 22 24" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Nature on Zoom</span>
        </a>
        
        <!-- Navigation -->
        <nav class="nav" aria-label="Main navigation">
          <a href="index.html" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            <span>Watch</span>
          </a>
          <a href="charge.html" class="nav-link active" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
              <line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
            <span>Charge</span>
          </a>
          <a href="index.html" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span>Check</span>
          </a>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="page-content charge-page">
      <div class="container charge-container">
        <!-- Header -->
        <div class="charge-header">
          <h1>Complete Your Purchase</h1>
          <p class="text-secondary">Secure payment for premium streaming access</p>
          <div class="charge-amount">
            <span class="charge-amount-value">$5</span>
            <span class="charge-amount-label">one-time</span>
          </div>
        </div>

        <!-- Payment Form -->
        <div class="charge-form animate-fadeInUp">
          <!-- Stream Info (will be populated by JS) -->
          <div class="charge-stream-info" id="stream-info">
            <div class="charge-stream-thumb" id="stream-thumb"></div>
            <div>
              <div class="charge-stream-title" id="stream-title">Premium Stream Access</div>
              <div class="charge-stream-duration">1 Hour Streaming</div>
            </div>
          </div>

          <!-- Card Preview -->
          <div class="payment-card">
            <svg class="payment-card-logo" viewBox="0 0 48 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="16" cy="16" r="14" fill="#EB001B" fill-opacity="0.8"/>
              <circle cx="32" cy="16" r="14" fill="#F79E1B" fill-opacity="0.8"/>
              <path d="M24 5.5C27.5 8 29.5 11.5 29.5 16C29.5 20.5 27.5 24 24 26.5C20.5 24 18.5 20.5 18.5 16C18.5 11.5 20.5 8 24 5.5Z" fill="#FF5F00"/>
            </svg>
            <div class="payment-card-number" id="card-preview">•••• •••• •••• ••••</div>
            <div class="payment-card-details">
              <span id="card-holder-preview">CARDHOLDER NAME</span>
              <span id="card-expiry-preview">MM/YY</span>
            </div>
          </div>

          <!-- Form -->
          <form id="payment-form">
            <div class="form-group">
              <label class="form-label" for="card-number">Card Number</label>
              <input type="text" class="form-input" id="card-number" 
                     placeholder="1234 5678 9012 3456" 
                     maxlength="19" 
                     inputmode="numeric"
                     autocomplete="cc-number">
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="card-expiry">Expiry Date</label>
                <input type="text" class="form-input" id="card-expiry" 
                       placeholder="MM/YY" 
                       maxlength="5" 
                       inputmode="numeric"
                       autocomplete="cc-exp">
              </div>
              <div class="form-group">
                <label class="form-label" for="card-cvv">CVV</label>
                <input type="text" class="form-input" id="card-cvv" 
                       placeholder="123" 
                       maxlength="3" 
                       inputmode="numeric"
                       autocomplete="cc-csc">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="card-holder">Cardholder Name</label>
              <input type="text" class="form-input" id="card-holder" 
                     placeholder="John Doe"
                     autocomplete="cc-name">
            </div>

            <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: var(--space-6);" id="pay-btn">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              Pay $5.00 Now
            </button>
          </form>

          <p class="text-center text-sm text-muted mt-6">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="display: inline; vertical-align: middle; margin-right: 4px;">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Your payment is secured with 256-bit SSL encryption
          </p>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <p>© 2024 Nature on Zoom. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/payment.js"></script>
</body>
</html>
