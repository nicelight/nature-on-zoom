<body>
  <div class="page">
    <!-- Header -->

      <div class="container header-inner">
        <!-- Logo -->
        <a href="index.html" class="logo" aria-label="Nature on Zoom Home">
          <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" fill="#7CB690" opacity="0.2"/>

            <path d="M18 24C18 24 19 25 20 25C21 25 22 24 22 24" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Nature on Zoom</span>
        </a>
        
        <!-- Navigation -->
        <nav class="nav" aria-label="Main navigation">
          <a href="index.html" class="nav-link active" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="23 7 16 12 23 17 23 7"/>

            </svg>
            <span>Watch</span>

          <a href="charge.html" class="nav-link">

          <a href="index.html" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            </svg>

      </div>
    </header>

    <!-- Main Content -->
    <main class="page-content">
      <div class="container-content">
        <!-- Page Title -->
        <div class="page-title">
          <h1>Live Bird Nest Webcams</h1>
          <p>Experience nature up close — watch wildlife from around the world</p>
        </div>

        <!-- Streams List -->
        <div class="streams-list" id="streams-list">

    <!-- Footer -->

  <!-- OAuth Modal -->
  <div class="modal-overlay" id="oauth-modal">
    <div class="modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">
      <button type="button" class="modal-close" id="modal-close" aria-label="Close modal">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      
      <div class="modal-header">
        <!-- Google Logo -->
        <svg class="modal-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

        </svg>
        <h2 class="modal-title" id="modal-title">Sign in with Google</h2>
        <p class="modal-subtitle">to continue to Nature on Zoom</p>
      </div>
      
      <form id="oauth-form">
        <div class="form-group">
          <label class="form-label" for="oauth-email">Email</label>
          <input type="email" class="form-input" id="oauth-email" placeholder="your@email.com" autocomplete="email">
        </div>
        
        <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: var(--space-4);">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Continue with Google
        </button>
      </form>
      
      <div class="divider">or</div>
      
      <p class="text-center text-sm text-secondary">
        By continuing, you agree to our<br>
        <a href="#" class="link">Terms of Service</a> and <a href="#" class="link">Privacy Policy</a>
      </p>
